<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOKO_dev - الصفحة الرسمية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #334155;
        }

        /* تنسيق صورة الملف الشخصي */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* جعل الصورة دائرية */
            border: 4px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.bio {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* قسم الأزرار */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-yt {
            background-color: #ff0000;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        .btn-itch {
            background-color: #fa5c5c;
            color: white;
            box-shadow: 0 4px 15px rgba(250, 92, 92, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #334155, transparent);
            margin: 30px 0;
        }

        /* قسم الألعاب */
        .section-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: #f1f5f9;
        }

        .games-grid {
            display: flex;
            justify-content: center;
        }

        .game-card {
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            max-width: 380px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.2);
        }

        .game-card img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid #334155;
        }

        .game-info {
            padding: 20px;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .game-btn {
            display: block;
            background: #0284c7;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .game-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم رأس الصفحة - الصورة المدمجة هنا -->
        <img src="https://i.ibb.co/s9Pswv7m/channels4-profile.jpg" alt="SOKO_dev Profile" class="profile-img">
        <h1>SOKO_dev</h1>
        <p class="bio">صانع محتوى ومطور ألعاب مستقل 🎮<br>Game Developer & Content Creator</p>

        <!-- روابط التواصل -->
        <div class="social-links">
            <a href="https://www.youtube.com/@SOKO_dev" target="_blank" class="btn btn-yt">قناة اليوتيوب 🔴</a>
            <a href="https://soko-dev.itch.io/" target="_blank" class="btn btn-itch">حساب Itch.io 🕹️</a>
        </div>

        <hr>

        <!-- قسم عرض الألعاب -->
        <h2 class="section-title">الألعاب والمشاريع 🚀</h2>
        
        <div class="games-grid">
            <!-- Escape The OS -->
            <div class="game-card">
                <img src="https://i.ibb.co/93NDH69b/escape-the-os.jpg" alt="Escape The OS">
                <div class="game-info">
                    <div class="game-title">ESCAPE THE OS</div>
                    <a href="https://soko-dev.itch.io/" target="_blank" class="game-btn">تجربة اللعبة على Itch.io 🎮</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
